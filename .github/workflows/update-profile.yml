name: refresh live server

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    paths:
      - profile.json
      - cmd/gen/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: generate svg + readme
        run: go run ./cmd/gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit if changed
        run: |
          git config user.name  "sharanya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/server.svg README.md
          git diff --cached --quiet || git commit -m "chore: refresh live server [skip ci]"
          git push
