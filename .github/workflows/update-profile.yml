name: refresh profile

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - cmd/gen/**
      - render/**
      - assets/sprite/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: live stats
        run: go run ./cmd/gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: render animated stats (only when the numbers or the scene changed)
        run: |
          if git diff --quiet HEAD -- assets/stats-data.json && git diff --quiet HEAD~1 HEAD -- render assets/sprite && ls assets/stats-*.gif >/dev/null 2>&1; then
            echo "stats unchanged, keeping the current GIF"; exit 0
          fi
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          cd render && npm ci --silent && cd ..
          node render/render.mjs
      - name: commit if changed
        run: |
          git config user.name  "sharanya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git diff --cached --quiet || git commit -m "chore: refresh profile [skip ci]"
          git push
