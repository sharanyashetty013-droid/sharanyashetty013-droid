name: refresh profile

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - cmd/gen/**
      - render/**
      - assets/game/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: live stats
        run: go run ./cmd/gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: render game GIF (only when its text/numbers or code changed)
        run: |
          if git diff --quiet HEAD -- assets/game-data.json && ls assets/banner-*.gif >/dev/null 2>&1 && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "game data unchanged, keeping existing GIF"; exit 0
          fi
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          cd render && npm ci --silent && cd ..
          node render/render.mjs
      - name: commit if changed
        run: |
          git config user.name  "sharanya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git diff --cached --quiet || git commit -m "chore: refresh profile [skip ci]"
          git push
