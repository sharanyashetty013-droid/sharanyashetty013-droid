name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml, scripts/recolor_koi.py]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with:
          body: asagi
          size: 1024x256
          scale: 1
          output-dir: koi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recolour the koi (sakura in moving water)
        run: |
          pip install --quiet pillow numpy
          python scripts/recolor_koi.py koi/koi.gif
      - name: Give the GIF a content-hashed name so GitHub's image cache never shows an old koi
        shell: bash
        run: |
          hash=$(sha256sum koi/koi.gif | cut -c1-8)
          rm -f koi/koi-*.gif
          cp koi/koi.gif "koi/koi-$hash.gif"
          sed -i -E "s#\./koi/koi(-[0-9a-f]{8})?\.gif#./koi/koi-$hash.gif#" README.md
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add -A koi README.md
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          # The profile refresh workflow also pushes, so catch up before pushing.
          git pull --rebase --quiet
          git push --quiet
