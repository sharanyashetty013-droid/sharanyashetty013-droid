<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Type";src:url("../assets/fonts/typewriter.woff2") format("woff2")}
@font-face{font-family:"Nunito";font-weight:800;src:url("../assets/fonts/nunito-800.woff2") format("woff2")}
html,body{margin:0;background:#fff}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="880" height="440"></canvas>
<script>
// "Case File" mystery scene. draw(t) is pure (same t -> same frame) so the
// renderer can step through time and the GIF loops seamlessly.
const W = 880, H = 440, LOOP = 14;
const FLOOR = 330;                 // feet line
const S = 0.21;                    // character scale (parts are drawn in 426x1024 source space)
const ANCHOR = [210, 968];
const STAND = 300;                 // where she stops in front of the board
const WALK_IN = [0, 3], WALK_OUT = [11.8, 14];
const CLUE_T0 = 3.6, CLUE_DT = 1.12, STAMP_T = 10.4, FADE_T = 13.0;
const DATA = window.DATA || {name: "Sharanya L Shetty", tagline: "backend · blockchain · problem solver", lines: ["Detective's log."], clues: []};

const ctx = document.getElementById("c").getContext("2d");
const P = {};
const load = n => new Promise(r => { const i = new Image(); i.onload = () => { P[n] = i; r(); }; i.src = "../assets/game/" + n + ".png"; });
window.ready = (async () => {
  await Promise.all(["hair", "body", "armL", "armR", "legL", "legR", "blink", "face"].map(load));
  await document.fonts.load('20px "Type"'); await document.fonts.load('800 20px "Nunito"');
  return true;
})();

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const easeOut = u => 1 - Math.pow(1 - u, 3);
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };

// ---------- room ----------
function room(t) {
  ctx.fillStyle = "#f8eedc"; ctx.fillRect(0, 0, W, FLOOR);
  ctx.fillStyle = "#f2e2c6"; for (let x = 0; x < W; x += 28) ctx.fillRect(x, 0, 12, FLOOR);
  // window + daylight
  ctx.fillStyle = "#7a5230"; rr(54, 78, 156, 150, 6); ctx.fill();
  const sky = ctx.createLinearGradient(0, 86, 0, 220); sky.addColorStop(0, "#bfeaf8"); sky.addColorStop(1, "#eaf8fd");
  ctx.fillStyle = sky; ctx.fillRect(62, 86, 140, 134);
  ctx.save(); ctx.beginPath(); ctx.rect(62, 86, 140, 134); ctx.clip();
  ctx.fillStyle = "#fff"; [[98, 120, 16], [116, 112, 20], [138, 122, 15]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x + (t / LOOP) * 160 - 40, y, r, 0, 7); ctx.fill(); });
  ctx.restore();
  ctx.fillStyle = "#7a5230"; ctx.fillRect(129, 86, 6, 134); ctx.fillRect(62, 150, 140, 6);
  ctx.fillStyle = "#6a4426"; ctx.fillRect(46, 226, 172, 10);
  // light beam on the floor
  const beam = ctx.createLinearGradient(130, 150, 330, 430); beam.addColorStop(0, "rgba(255,244,200,.55)"); beam.addColorStop(1, "rgba(255,244,200,0)");
  ctx.fillStyle = beam; ctx.beginPath(); ctx.moveTo(62, 220); ctx.lineTo(202, 220); ctx.lineTo(420, 440); ctx.lineTo(120, 440); ctx.fill();
  // dust drifting in the light (period = LOOP, seamless)
  ctx.fillStyle = "rgba(255,255,255,.9)";
  for (let i = 0; i < 14; i++) { const y = 240 + (((rnd(i) * 200 - (t / LOOP) * 200 * (1 + (i % 2))) % 200) + 200) % 200; const x = 90 + rnd(i + 3) * 200 + (y - 240) * 0.6; ctx.beginPath(); ctx.arc(x, y, 1.3, 0, 7); ctx.fill(); }
  // baseboard + floor
  ctx.fillStyle = "#8b5e3c"; ctx.fillRect(0, FLOOR - 14, W, 14);
  ctx.fillStyle = "#a9744b"; ctx.fillRect(0, FLOOR - 14, W, 3);
  const fl = ctx.createLinearGradient(0, FLOOR, 0, H); fl.addColorStop(0, "#e9c897"); fl.addColorStop(1, "#dcb47e");
  ctx.fillStyle = fl; ctx.fillRect(0, FLOOR, W, H - FLOOR);
  ctx.strokeStyle = "rgba(120,80,40,.25)"; ctx.lineWidth = 1.5;
  for (let y = FLOOR + 18; y < H; y += 18) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let r = 0; r < 7; r++) for (let x = (r % 2) * 70; x < W; x += 140) { const y = FLOOR + r * 18; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 18); ctx.stroke(); }
}

// ---------- evidence board ----------
const BOARD = {x: 420, y: 70, w: 440, h: 238};
const PHOTO = {x: 640, y: 180};
const NOTES = [[488, 112, -4], [792, 110, 3], [482, 238, 3], [800, 236, -3], [586, 276, -2], [712, 276, 2]];
function clueTime(i) { return CLUE_T0 + i * CLUE_DT; }
function pin(x, y) { ctx.fillStyle = "#c1121f"; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.beginPath(); ctx.arc(x - 1.5, y - 1.5, 1.6, 0, 7); ctx.fill(); }
function board(t) {
  const fade = t > FADE_T ? 1 - (t - FADE_T) : 1;
  const shake = t > STAMP_T + 0.18 && t < STAMP_T + 0.45 ? Math.sin(t * 90) * 3 : 0;
  ctx.save(); ctx.translate(shake, 0);
  const {x, y, w, h} = BOARD;
  ctx.fillStyle = "rgba(60,30,10,.18)"; rr(x + 6, y + 8, w, h, 8); ctx.fill();
  ctx.fillStyle = "#8b5e3c"; rr(x - 8, y - 8, w + 16, h + 16, 8); ctx.fill();
  ctx.fillStyle = "#d8b07f"; ctx.fillRect(x, y, w, h);
  for (let i = 0; i < 260; i++) { ctx.fillStyle = rnd(i) > .5 ? "rgba(140,90,40,.18)" : "rgba(255,240,210,.25)"; ctx.fillRect(x + rnd(i + 1) * w, y + rnd(i + 2) * h, 2, 2); }

  const clues = DATA.clues;
  // red strings (behind notes)
  clues.forEach((c, i) => {
    const ct = clueTime(i) + 0.35; if (t < ct) return;
    const u = clamp((t - ct) / 0.4, 0, 1), [nx, ny] = NOTES[i];
    const sx = nx, sy = ny - 16, ex = PHOTO.x, ey = PHOTO.y - 52;
    ctx.save(); ctx.globalAlpha = fade; ctx.strokeStyle = "#d62828"; ctx.lineWidth = 2.2; ctx.beginPath();
    for (let k = 0; k <= 20 * u; k++) { const v = k / 20, mx = lerp(sx, ex, v), my = lerp(sy, ey, v) + Math.sin(Math.PI * v) * 14; k ? ctx.lineTo(mx, my) : ctx.moveTo(mx, my); }
    ctx.stroke(); ctx.restore();
  });
  // suspect photo
  ctx.save(); ctx.translate(PHOTO.x, PHOTO.y); ctx.rotate(-0.04);
  ctx.fillStyle = "rgba(0,0,0,.15)"; ctx.fillRect(-44, -52, 92, 112);
  ctx.fillStyle = "#fff"; ctx.fillRect(-48, -56, 96, 112);
  ctx.fillStyle = "#e8f6fb"; ctx.fillRect(-40, -48, 80, 78);
  ctx.save(); ctx.beginPath(); ctx.rect(-40, -48, 80, 78); ctx.clip();
  ctx.drawImage(P.face, -40, -48, 80, 80 * P.face.height / P.face.width); ctx.restore();
  ctx.fillStyle = "#c1121f"; ctx.font = '12px "Type"'; ctx.textAlign = "center"; ctx.fillText("SUSPECT", 0, 46); ctx.textAlign = "left";
  ctx.restore(); pin(PHOTO.x, PHOTO.y - 52);
  // notes
  clues.forEach((c, i) => {
    const [nx, ny, rot] = NOTES[i], ct = clueTime(i);
    const found = t >= ct + 0.25 && t < FADE_T + 0.6, pop = t >= ct + 0.25 && t < ct + 0.55 ? Math.sin((t - ct - 0.25) / 0.3 * Math.PI) * 0.12 : 0;
    ctx.save(); ctx.translate(nx, ny); ctx.rotate(rot * Math.PI / 180); ctx.scale(1 + pop, 1 + pop);
    ctx.fillStyle = "rgba(0,0,0,.14)"; ctx.fillRect(-53, -18, 110, 44);
    ctx.fillStyle = found ? (i % 2 ? "#fff6a8" : "#fffdf6") : "#efe4cf"; ctx.fillRect(-56, -22, 112, 44);
    ctx.textAlign = "center";
    if (found) {
      ctx.fillStyle = "#1e1e1e"; ctx.font = '14px "Type"'; ctx.fillText(c.title, 0, -2);
      ctx.fillStyle = "#7a5230"; ctx.font = '11px "Type"'; ctx.fillText(c.sub, 0, 14);
    } else { ctx.fillStyle = "#b9a684"; ctx.font = '18px "Type"'; ctx.fillText("? ? ?", 0, 6); }
    ctx.textAlign = "left"; ctx.restore();
    pin(nx, ny - 16);
  });
  // CASE CLOSED stamp
  if (t >= STAMP_T) {
    const u = clamp((t - STAMP_T) / 0.18, 0, 1), s = lerp(2.4, 1, easeOut(u));
    ctx.save(); ctx.globalAlpha = clamp(fade, 0, 1) * (0.25 + 0.65 * u); ctx.translate(PHOTO.x, PHOTO.y + 4); ctx.rotate(-0.17); ctx.scale(s, s);
    ctx.strokeStyle = "#c1121f"; ctx.lineWidth = 5; rr(-128, -28, 256, 56, 8); ctx.stroke(); ctx.lineWidth = 2; rr(-120, -21, 240, 42, 5); ctx.stroke();
    ctx.fillStyle = "#c1121f"; ctx.font = '34px "Type"'; ctx.textAlign = "center"; ctx.fillText("CASE CLOSED", 0, 12); ctx.textAlign = "left";
    ctx.restore();
  }
  ctx.restore();
}

// magnifying glass that hops from clue to clue
function lens(t) {
  if (t < CLUE_T0 - 0.4 || t > STAMP_T) return;
  const n = DATA.clues.length, i = Math.floor((t - CLUE_T0) / CLUE_DT);
  const target = k => { const [nx, ny] = NOTES[clamp(k, 0, n - 1)]; return [nx + 10, ny + 4]; };
  let x, y;
  if (i < 0) { const u = ease(clamp((t - (CLUE_T0 - 0.4)) / 0.4, 0, 1)); x = lerp(STAND + 40, target(0)[0], u); y = lerp(220, target(0)[1], u); }
  else { const local = t - clueTime(i), [ax, ay] = target(i), [bx, by] = target(i + 1); const u = i >= n - 1 ? 0 : ease(clamp((local - 0.7) / 0.42, 0, 1)); x = lerp(ax, bx, u); y = lerp(ay, by, u) - Math.sin(u * Math.PI) * 20; }
  ctx.save(); ctx.globalAlpha = clamp((STAMP_T - t) / 0.3, 0, 1);
  ctx.strokeStyle = "#5a3e22"; ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(x + 20, y + 20); ctx.lineTo(x + 40, y + 40); ctx.stroke();
  ctx.fillStyle = "rgba(200,240,255,.35)"; ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.fill();
  ctx.strokeStyle = "#c79a3b"; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 18, 3.6, 4.6); ctx.stroke();
  ctx.restore();
}

// ---------- character (puppet rig) ----------
function skirt(sway) {
  const topY = 452, tl = 123, tr = 290, hl = 104, hr = 309, hy = 624, curve = 12, n = 10;
  ctx.save(); ctx.translate(206, topY); ctx.transform(1, 0, sway, 1, 0, 0); ctx.translate(-206, -topY);
  for (let i = 0; i < n; i++) {
    const a = i / n, b = (i + 1) / n, g = ctx.createLinearGradient(0, topY, 0, hy);
    if (i % 2) { g.addColorStop(0, "#0f3554"); g.addColorStop(1, "#0a2740"); } else { g.addColorStop(0, "#1b5b8c"); g.addColorStop(1, "#11446c"); }
    ctx.fillStyle = g; ctx.beginPath();
    ctx.moveTo(tl + a * (tr - tl), topY); ctx.lineTo(tl + b * (tr - tl), topY);
    ctx.lineTo(hl + b * (hr - hl), hy + curve * Math.sin(Math.PI * b)); ctx.lineTo(hl + a * (hr - hl), hy + curve * Math.sin(Math.PI * a));
    ctx.closePath(); ctx.fill();
  }
  const sh = ctx.createLinearGradient(0, topY, 0, hy); sh.addColorStop(0, "rgba(0,0,0,.45)"); sh.addColorStop(.25, "rgba(0,0,0,0)");
  ctx.fillStyle = sh; ctx.beginPath(); ctx.moveTo(tl, topY); ctx.lineTo(tr, topY); ctx.lineTo(hr, hy); ctx.lineTo(hl, hy); ctx.fill();
  ctx.strokeStyle = "#00ADD8"; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.beginPath();
  for (let i = 0; i <= 20; i++) { const u = i / 20; ctx.lineTo(hl + u * (hr - hl), hy + curve * Math.sin(Math.PI * u)); }
  ctx.stroke(); ctx.restore();
  ctx.fillStyle = "#0a2238"; ctx.beginPath(); ctx.moveTo(tl - 1, topY - 11); ctx.quadraticCurveTo(206, topY - 15, tr + 1, topY - 11); ctx.lineTo(tr + 1, topY + 1); ctx.quadraticCurveTo(206, topY - 3, tl - 1, topY + 1); ctx.fill();
  ctx.fillStyle = "#FDDD00"; ctx.fillRect(199, 439, 14, 11); ctx.fillStyle = "#0a2238"; ctx.fillRect(203, 442, 6, 5);
}
function part(img, px, py, ang, dy = 0) {
  ctx.save(); ctx.translate(px, py + dy); ctx.rotate(ang); ctx.translate(-px, -py); ctx.drawImage(img, 0, 0, 426, 1024); ctx.restore();
}
function charX(t) {
  if (t < WALK_IN[1]) return lerp(-90, STAND, t / WALK_IN[1]);
  if (t > WALK_OUT[0]) return lerp(STAND, W + 90, (t - WALK_OUT[0]) / (WALK_OUT[1] - WALK_OUT[0]));
  return STAND;
}
function character(t) {
  const walking = t < WALK_IN[1] || t > WALK_OUT[0];
  const ph = Math.PI * 2 * t / 0.62, s = Math.sin(ph);
  const x = charX(t);
  const bob = walking ? Math.abs(Math.cos(ph)) * 4 : Math.sin(t * 2.2) * 1.2;
  ctx.fillStyle = "rgba(90,50,20,.22)"; ctx.beginPath(); ctx.ellipse(x, FLOOR + 2, 36, 6, 0, 0, 7); ctx.fill();

  ctx.save(); ctx.translate(x, FLOOR - bob); ctx.scale(S, S); ctx.translate(-ANCHOR[0], -ANCHOR[1]);
  const deg = Math.PI / 180;
  ctx.save(); ctx.translate(206, 150); ctx.transform(1, 0, (walking ? -0.04 + 0.04 * s : 0.025 * Math.sin(t * 1.8)), 1, 0, 0); ctx.translate(-206, -150);
  ctx.drawImage(P.hair, 0, 0, 426, 1024); ctx.restore();
  // legs: alternate lift + small swing (front-facing walk)
  const liftL = walking ? Math.max(0, s) * 42 : 0, liftR = walking ? Math.max(0, -s) * 42 : 0;
  part(P.legL, 165, 522, walking ? s * 5 * deg : 0, -liftL);
  part(P.legR, 252, 522, walking ? s * 5 * deg : 0, -liftR);
  ctx.drawImage(P.body, 0, 0, 426, 1024);
  skirt(walking ? 0.05 * s : 0.02 * Math.sin(t * 2.2));
  const sw = walking ? s * 9 * deg : Math.sin(t * 2.2) * 1.2 * deg;
  part(P.armL, 132, 270, sw);
  part(P.armR, 298, 270, sw);
  const bt = t % 3.3;
  if ((bt > 2.0 && bt < 2.14) || (bt > 2.3 && bt < 2.42)) ctx.drawImage(P.blink, 0, 0, 426, 1024);
  ctx.restore();
}

function popup(text, x, y, u, color) {
  ctx.save(); ctx.globalAlpha = clamp(1.5 - u * 1.5, 0, 1);
  ctx.font = '15px "Type"'; ctx.textAlign = "center"; ctx.lineJoin = "round"; ctx.lineWidth = 5; ctx.strokeStyle = "#fffaf0";
  ctx.strokeText(text, x, y - u * 30); ctx.fillStyle = color; ctx.fillText(text, x, y - u * 30);
  ctx.restore();
}

function draw(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  room(t);
  board(t);
  character(t);
  lens(t);
  DATA.clues.forEach((c, i) => { const ct = clueTime(i) + 0.25; if (t >= ct && t < ct + 0.9) popup("CLUE FOUND!", NOTES[i][0], NOTES[i][1] - 30, (t - ct) / 0.9, "#c1121f"); });

  // ---- HUD ----
  ctx.fillStyle = "#1e1e1e"; ctx.font = '28px "Type"'; ctx.fillText(DATA.name.toUpperCase(), 24, 42);
  ctx.fillStyle = "#8b5e3c"; ctx.font = '800 14px "Nunito"'; ctx.fillText(DATA.tagline, 26, 62);
  const found = DATA.clues.filter((c, i) => t >= clueTime(i) + 0.25 && t < FADE_T + 0.6).length;
  ctx.fillStyle = "#fffaf0"; rr(712, 16, 148, 40, 8); ctx.fill(); ctx.strokeStyle = "#5a3e22"; ctx.lineWidth = 2; rr(712, 16, 148, 40, 8); ctx.stroke();
  ctx.strokeStyle = "#c79a3b"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(734, 34, 8, 0, 7); ctx.stroke();
  ctx.strokeStyle = "#5a3e22"; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(740, 40); ctx.lineTo(747, 47); ctx.stroke();
  ctx.fillStyle = "#1e1e1e"; ctx.font = '18px "Type"'; ctx.fillText(`CLUES ${found}/${DATA.clues.length}`, 756, 42);

  // ---- dialogue ----
  ctx.fillStyle = "rgba(255,250,240,.97)"; rr(24, 352, 832, 76, 10); ctx.fill();
  ctx.strokeStyle = "#5a3e22"; ctx.lineWidth = 3; rr(24, 352, 832, 76, 10); ctx.stroke();
  ctx.fillStyle = "#8b5e3c"; rr(42, 338, 200, 28, 6); ctx.fill();
  ctx.fillStyle = "#fffaf0"; ctx.font = '14px "Type"'; ctx.fillText("DETECTIVE'S LOG", 58, 357);
  const lines = DATA.lines, slot = LOOP / lines.length, li = Math.floor(t / slot);
  const shown = lines[li].slice(0, Math.floor((t - li * slot) / 0.04));
  ctx.fillStyle = "#1e1e1e"; ctx.font = '19px "Type"'; ctx.fillText(shown, 48, 401);
  if (Math.floor(t * 2.5) % 2 === 0) { ctx.fillStyle = "#8b5e3c"; ctx.beginPath(); ctx.moveTo(826, 404); ctx.lineTo(840, 404); ctx.lineTo(833, 413); ctx.fill(); }
}
window.draw = draw;
window.LOOP = LOOP;
</script>
</body>
</html>
