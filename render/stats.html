<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Pixel";src:url("../assets/fonts/pixel.woff2") format("woff2")}
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><canvas id="c" width="1320" height="540"></canvas>
<script>
// Island Records: stats carved on standing stone tablets under the moon. Pure draw(t) -> seamless loop.
const W = 1320, H = 540, LOOP = 6, GROUND = 492;
const D = Object.assign({contributions: 471, streak: 16, best: 17, lc: {easy: 40, medium: 18, hard: 3}, wins: 3, level: 6}, window.DATA || {});
const ctx = document.getElementById("c").getContext("2d");
const G = {};
const load = (n, s) => new Promise(r => { const i = new Image(); i.onload = () => { G[n] = i; r(); }; i.src = s; });
window.ready = (async () => { await load("bg", "../assets/sprite/" + "bg_moai.jpg"); await document.fonts.load('12px "Pixel"'); return true; })();
const rnd = i => { const v = Math.sin(i * 91.7 + 13.3) * 43758.5453; return v - Math.floor(v); };
const px = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const TAU = Math.PI * 2;

function stone(x, y, w, h, seed) {
  const P = 4;
  // soft moon-glow halo behind each stone
  const g = ctx.createRadialGradient(x + w / 2, y + h * 0.35, 10, x + w / 2, y + h * 0.35, w);
  g.addColorStop(0, "rgba(255,240,170,.18)"); g.addColorStop(1, "rgba(255,240,170,0)"); ctx.fillStyle = g; ctx.fillRect(x - w / 2, y - 40, w * 2, h);
  // silhouette: slightly narrower toward the top, domed corners
  for (let yy = 0; yy < h; yy += P) {
    const inset = Math.round((1 - yy / h) * 2) * P;
    const x0 = x + inset, x1 = x + w - inset;
    px(x0 - P, y + yy, x1 - x0 + 2 * P, P, "#14181d");
    for (let xx = x0; xx < x1; xx += P) {
      const u = (xx - x0) / (x1 - x0), r = rnd(seed * 977 + xx * 3 + yy * 11);
      let c = u < 0.1 ? "#3b434a" : u > 0.88 ? "#2c3238" : "#59624f";
      if (u > 0.1 && u < 0.88) c = r > 0.96 ? "#8da34a" : r > 0.9 ? "#4c5546" : r > 0.84 ? "#68725d" : c;
      if (yy < 2 * P) c = "#a8a47a";
      if (u > 0.08 && u < 0.14 && yy > 2 * P) c = "#7c8070";        // lit left bevel
      px(xx, y + yy, P, P, c);
    }
  }
  // carved inner panel
  px(x + 20, y + 22, w - 40, h - 44, "rgba(10,14,20,.42)");
  px(x + 20, y + 22, w - 40, 3, "rgba(0,0,0,.35)"); px(x + 20, y + h - 25, w - 40, 3, "rgba(255,255,220,.12)");
  // glyph columns along both sides of the panel
  for (let i = 0; i < Math.floor((h - 60) / 22); i++) {
    const k = Math.floor(rnd(seed * 51 + i) * 4), gy = y + 32 + i * 22;
    const shapes = [[[0,0],[1,0],[1,1],[1,2],[0,2]], [[1,0],[0,1],[1,1],[2,1],[1,2]], [[0,0],[0,1],[0,2],[1,2],[2,2]], [[0,0],[2,0],[1,1],[0,2],[2,2]]];
    [x + 26, x + w - 38].forEach((gx, side) => shapes[(k + side) % 4].forEach(([a, b]) => px(gx + a * 4, gy + b * 4, 4, 4, "#1d2228")));
  }
  // base sinks into the grass
  px(x - 6, y + h - 6, w + 12, 10, "#4f7f1f"); for (let i = 0; i < w + 12; i += 6) px(x - 6 + i, y + h - 10 - (rnd(seed + i) * 6 | 0), 3, 8, "#9cc93b");
}
function glow(text, cx, y, size, t, ph) {
  const p = 0.72 + 0.28 * Math.sin(t / LOOP * TAU * 2 + ph);
  ctx.font = `${size}px "Pixel"`; ctx.textAlign = "center";
  ctx.shadowColor = `rgba(255,214,70,${p})`; ctx.shadowBlur = 22 * p; ctx.fillStyle = "#ffe066"; ctx.fillText(text, cx, y);
  ctx.shadowBlur = 0; ctx.globalAlpha = 0.4 * p; ctx.fillStyle = "#fffbe0"; ctx.fillText(text, cx, y); ctx.globalAlpha = 1; ctx.textAlign = "left";
}
function carve(text, cx, y, size = 14, c = "#e3dcab") { ctx.font = `${size}px "Pixel"`; ctx.textAlign = "center"; ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillText(text, cx + 1, y + 2); ctx.fillStyle = c; ctx.fillText(text, cx, y); ctx.textAlign = "left"; }

function draw(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  ctx.imageSmoothingEnabled = false;
  // sky + moon (top of the picture) and grass band, mirrored sideways into a wide strip
  // one copy of the picture in the middle; the sides reuse its moon-free right edge, mirrored
  const pano = (sy, sh, dy) => {
    ctx.drawImage(G.bg, 0, sy, 736, sh, 292, dy, 736, sh);
    for (const x of [0, 1028]) { ctx.save(); ctx.translate(x + 146, 0); ctx.scale(-1, 1); ctx.translate(-(x + 146), 0); ctx.drawImage(G.bg, 444, sy, 292, sh, x, dy, 292, sh); ctx.restore(); }
  };
  pano(0, GROUND, 0);
  pano(1050, H - GROUND, GROUND);
  px(0, GROUND, W, 3, "#b4dc5a");
  // twinkles
  for (let i = 0; i < 36; i++) { const tw = Math.sin(t / LOOP * TAU * (1 + i % 3) + i * 1.9); if (tw > 0.6) { const x = rnd(i) * W, y = rnd(i + 40) * 200; px(x, y, 3, 3, "#fff"); if (tw > 0.9) { px(x - 3, y + 1, 9, 1, "#cfe0ff"); px(x + 1, y - 3, 1, 9, "#cfe0ff"); } } }

  // title plaque
  ctx.font = '22px "Pixel"'; ctx.textAlign = "left"; ctx.lineJoin = "miter"; ctx.lineWidth = 8; ctx.strokeStyle = "#0b1020";
  ctx.strokeText("ISLAND RECORDS", 30, 50); ctx.fillStyle = "#fff"; ctx.fillText("ISLAND RECORDS", 30, 50);
  px(1188, 20, 104, 44, "#0b1020"); px(1192, 24, 96, 36, "#1a2a4a"); glow("LV " + D.level, 1240, 52, 18, t, 0);

  // four standing stones
  const SW = 262, SH = 276, gap = 30, x0 = (W - 4 * SW - 3 * gap) / 2, top = GROUND - SH;
  const stones = [0, 1, 2, 3].map(i => [x0 + i * (SW + gap), top + [10, 0, 14, 4][i]]);
  stones.forEach(([x, y], i) => stone(x, y, SW, SH - [10, 0, 14, 4][i], i + 1));
  const cxs = stones.map(([x]) => x + SW / 2);
  const ys = stones.map(([, y]) => y);

  carve("COMMITS", cxs[0], ys[0] + 62); glow(String(D.contributions), cxs[0], ys[0] + 146, 46, t, 0.0); carve("IN " + new Date().getUTCFullYear(), cxs[0], ys[0] + 190, 12, "#cfc79a");
  carve("STREAK", cxs[1], ys[1] + 62); glow(String(D.streak), cxs[1], ys[1] + 150, 56, t, 1.5); carve("DAYS", cxs[1], ys[1] + 184, 14); carve("BEST " + D.best, cxs[1], ys[1] + 210, 12, "#cfc79a");
  carve("LEETCODE", cxs[2], ys[2] + 62); glow(String(D.lc.easy + D.lc.medium + D.lc.hard), cxs[2], ys[2] + 140, 50, t, 3.0);
  const mx = Math.max(D.lc.easy, D.lc.medium, D.lc.hard, 1);
  [["E", D.lc.easy], ["M", D.lc.medium], ["H", D.lc.hard]].forEach(([n, v], i) => { const bx = cxs[2] - 58, by = ys[2] + 160 + i * 22; ctx.font = '11px "Pixel"'; ctx.fillStyle = "#e3dcab"; ctx.fillText(n, bx - 14, by + 10); px(bx, by, 100, 10, "#1d2228"); ctx.shadowColor = "rgba(255,214,70,.8)"; ctx.shadowBlur = 8; px(bx, by, Math.max(6, 100 * v / mx), 10, "#ffe066"); ctx.shadowBlur = 0; ctx.fillStyle = "#fff3b0"; ctx.fillText(String(v), bx + 106, by + 10); });
  carve("WINS", cxs[3], ys[3] + 62); glow(String(D.wins), cxs[3], ys[3] + 150, 64, t, 4.5); carve("HACKATHONS", cxs[3], ys[3] + 186, 12, "#cfc79a"); carve("2ND 3RD 2ND", cxs[3], ys[3] + 210, 11, "#cfc79a");

  // fireflies drifting over the grass (each loops once per LOOP)
  for (let i = 0; i < 10; i++) {
    const u = (t / LOOP + rnd(i + 3)) % 1, x = (rnd(i) * W + u * 120) % W, y = GROUND - 30 - rnd(i + 8) * 200 + Math.sin(u * TAU * 2 + i) * 14;
    const a = Math.sin(u * TAU * 3 + i) * 0.5 + 0.5;
    ctx.globalAlpha = a; ctx.shadowColor = "#ffe066"; ctx.shadowBlur = 10; px(x, y, 4, 4, "#fff3a0"); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
}
window.draw = draw; window.LOOP = LOOP;
</script></body></html>
